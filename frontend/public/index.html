<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#FBF6EF" />
        <meta name="description" content="Test share description for social previews" />

        <!-- Favicons (rebuilt from admin-uploaded favicon_url on every save) -->
        <link rel="icon" href="https://example.com/test-favicon.png?v=dcf51efb" sizes="any" />
        <link rel="apple-touch-icon" sizes="180x180" href="https://example.com/test-favicon.png?v=dcf51efb" />

        <!-- Open Graph (social share previews for iMessage / IG DMs / FB / Slack / etc.) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="swell design + media" />
        <meta property="og:title" content="Test Share Title" />
        <meta property="og:description" content="Test share description for social previews" />
        <meta property="og:image" content="https://example.com/test-share.jpg?v=dcf51efb" />
        <meta property="og:url" content="https://balloon-decor-cms.preview.emergentagent.com" />

        <!-- Twitter card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Test Share Title" />
        <meta name="twitter:description" content="Test share description for social previews" />
        <meta name="twitter:image" content="https://example.com/test-share.jpg?v=dcf51efb" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
        <title>Test Share Title</title>
        <style>
            /* Pre-React splash — prevents any flash of unstyled content on first paint.
               Removed automatically once React mounts and renders its own splash/layout. */
            html, body { background-color: #FBF6EF; margin: 0; }
            @media (prefers-color-scheme: dark) {
                html, body { background-color: #141312; }
            }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
